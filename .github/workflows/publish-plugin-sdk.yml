name: Publish plugin SDK package

on:
  push:
    tags:
      - "plugin-sdk-v*"

permissions:
  contents: read

concurrency:
  group: publish-plugin-sdk
  cancel-in-progress: false

jobs:
  verify:
    name: Verify publishable artifact
    permissions:
      contents: read
    uses: ./.github/workflows/verify-plugin-packages.yml
    with:
      package: plugin-sdk

  publish:
    name: Publish verified artifact
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Download the verified package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/apinteract-plugin-release

      - name: Validate the artifact, release tag, and npm tag
        id: release
        env:
          EXPECTED_TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="${RUNNER_TEMP}/apinteract-plugin-release"
          (
            cd "${artifact_directory}"
            sha256sum --check SHA256SUMS
          )
          shopt -s nullglob
          tarballs=("${artifact_directory}"/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            printf 'Expected exactly one plugin SDK tarball.\n' >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          actual_sha256="$(sha256sum "${tarball}" | awk '{print $1}')"
          if [[ -z "${EXPECTED_TARBALL_SHA256}" || "${actual_sha256}" != "${EXPECTED_TARBALL_SHA256}" ]]; then
            printf 'Verified plugin SDK tarball checksum does not match the workflow handoff.\n' >&2
            exit 1
          fi

          manifest_file="${artifact_directory}/package.json"
          tar -xOf "${tarball}" package/package.json >"${manifest_file}"
          package_name="$(node -p "require(process.argv[1]).name" "${manifest_file}")"
          version="$(node -p "require(process.argv[1]).version" "${manifest_file}")"
          if [[ "${package_name}" != "@apinteract/plugin-sdk" ]]; then
            printf 'Unexpected package name in verified tarball: %s\n' "${package_name}" >&2
            exit 1
          fi
          expected_tag="plugin-sdk-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            printf 'Tag must exactly match the package version: %s\n' "${expected_tag}" >&2
            exit 1
          fi
          if [[ "${version}" =~ -oidc\.[0-9]+$ ]]; then
            npm_tag="oidc"
          elif [[ "${version}" == *-* ]]; then
            npm_tag="next"
          else
            npm_tag="latest"
          fi
          printf 'name=%s\nversion=%s\nnpm_tag=%s\ntarball=%s\n' \
            "${package_name}" "${version}" "${npm_tag}" "${tarball}" >>"${GITHUB_OUTPUT}"

      - name: Refuse to overwrite an immutable npm version
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          lookup_log="$(mktemp "${RUNNER_TEMP}/apinteract-npm-view.XXXXXXXX")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version --registry https://registry.npmjs.org > /dev/null 2>"${lookup_log}"; then
            printf 'npm version already exists and will not be overwritten: %s@%s\n' \
              "${PACKAGE_NAME}" "${VERSION}" >&2
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' "${lookup_log}"; then
            cat "${lookup_log}" >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: npm publish "${TARBALL}" --ignore-scripts --access public --tag "${NPM_TAG}" --provenance --registry https://registry.npmjs.org
