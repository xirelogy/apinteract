services:
  apinteract:
    volumes:
      - ./proxy.verify.yaml:/etc/apinteract/proxy.yaml:ro
    depends_on:
      target:
        condition: service_started

  target:
    image: apinteract/aio:local
    entrypoint:
      - node
      - /opt/apinteract/runtime/target-fixture.mjs
    user: "10001:10001"
    read_only: true
    restart: "no"
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=16m,mode=1777
